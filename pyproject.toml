[project]
name = "soc-security-automation"
version = "0.1.0"
description = "Vendor-neutral SOC alert enrichment and case-preparation workflow (SEC-AUTO-001)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Carlos Alberto Gutiérrez Rondón" }]
dependencies = ["requests==2.34.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
